# The dsh-tui-app bundle patch: the interactive full-screen terminal surface
# over the dsh-base layer. Applied after dsh-base's insert; rows here override
# base rows by id, with the profile's own cordis.patch.yml and any --patch
# overlays still to come.
#
# The tui-startup plugin injects `cmdlineArgs` and provides `tuiStartup` as an
# ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists; `dsh --profile tui
# --help` provides nothing, so no row waits on it and the terminal never takes
# over.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  inject: [tuiStartup]
  config:
    # The --tool-mode flag opts this process into a presentation mode; the
    # env seam keeps the headless/web convention for scripted launches.
    mode: !!js ctx.tuiStartup.toolMode ?? process.env.DSH_TOOLS_MODE

# ── terminal-only rows ──────────────────────────────────────────────────────

- insert:
    # The projection registry plus its durable checkpoint cache (over the
    # same storage root the web surface uses): /resume reads titles from the
    # zero-I/O checkpoint row or a tail-only cold read instead of scanning
    # whole logs, and checkpoints written by either surface serve both.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # The keyboard-backed provider behind ask_user_question and the plan-mode
    # review. TUI composes no presets, so the tool row mounts globally on the
    # host plane (the same row the web surface mounts per preset).
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # Ordinary provider for the parsed TUI flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: tui-startup
      name: '@deepseek-ai/dsh-tui-app/startup'

    # The interactive front door. Its lazy config reads the launcher-owned
    # identity from tuiStartup, so --help (which provides nothing) never mounts
    # the terminal.
    - id: tui
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.resumeSessionId ?? ctx.tuiStartup.sessionId ?? 'main'
        model: !!js ctx.tuiStartup.model
        showReasoning: true
        maxToolOutputLines: 6
